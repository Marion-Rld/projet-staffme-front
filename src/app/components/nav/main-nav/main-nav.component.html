<div class="navbar">
  <div class="navbar-left">
    <img src="assets/images/logos/staffme-logo.png" alt="Logo" class="logo" loading="lazy"/>
  </div>
  <div class="navbar-right">
    <button class="menu-button" (click)="toggleNav()">
      <img
        *ngIf="!showMobileMenu"
        src="assets/images/icons/main-menu-icon.svg"
        alt="Menu"
        loading="lazy"
      />
      <img
        *ngIf="showMobileMenu"
        src="assets/images/icons/main-close-icon.svg"
        alt="Fermer"
        loading="lazy"
      />
    </button>
  </div>
</div>

<div class="mobile-menu-dialog" [ngClass]="{ open: showMobileMenu }">
  <ul class="mobile-nav-list">
    <li>
      <a routerLink="/" routerLinkActive="active-link">Tableau de bord</a>
    </li>
    <li>
      <a routerLink="/projects" routerLinkActive="active-link">Projets</a>
    </li>
    <li><a routerLink="/teams" routerLinkActive="active-link">Équipes</a></li>
    <li>
      <a routerLink="/collaborators" routerLinkActive="active-link"
        >Collaborateurs</a
      >
    </li>
    <li *ngIf="isSuperAdmin | async">
      <a routerLink="/user-list" routerLinkActive="active-link"
        >Liste des utilisateurs</a
      >
    </li>
    <li class="item-logout"><a (click)="logout()" (keypress)="logout()" role="button" tabindex="0">Déconnexion</a></li>
  </ul>
</div>

<div class="sidenav-container">
  <div class="sidenav">
    <a routerLink="/">
      <div class="toolbar">
        <img
          src="assets/images/logos/staffme-logo.png"
          alt="Logo"
          class="logo"
          loading="lazy"
        />
      </div>
    </a>
    <ul class="nav-list">
      <li>
        <a routerLink="/" routerLinkActive="active-link">Tableau de bord</a>
      </li>
      <li>
        <a routerLink="/projects" routerLinkActive="active-link">Projets</a>
      </li>
      <li><a routerLink="/teams" routerLinkActive="active-link">Équipes</a></li>
      <li>
        <a routerLink="/collaborators" routerLinkActive="active-link"
          >Collaborateurs</a
        >
      </li>
      <li *ngIf="isSuperAdmin | async">
        <a routerLink="/user-list" routerLinkActive="active-link"
          >Liste des utilisateurs</a
        >
      </li>
    </ul>
    <div class="item-logout">
      <a (click)="logout()">
        <mat-icon>logout</mat-icon>
        Déconnexion
      </a>
    </div>
  </div>
</div>
