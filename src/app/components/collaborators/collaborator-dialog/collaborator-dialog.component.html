<h1 mat-dialog-title>{{ 'Modifier Collaborateur' }}</h1>
<div mat-dialog-content>
  <form [formGroup]="collaboratorForm">
    <mat-form-field appearance="fill">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="lastName" />
      <mat-error *ngIf="collaboratorForm.get('lastName')?.hasError('required')">
        Le nom est obligatoire.
      </mat-error>
      <mat-error *ngIf="collaboratorForm.get('lastName')?.hasError('minlength')">
        Le nom doit contenir au moins 2 caractères.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Prénom</mat-label>
      <input matInput formControlName="firstName" />
      <mat-error *ngIf="collaboratorForm.get('firstName')?.hasError('required')">
        Le prénom est obligatoire.
      </mat-error>
      <mat-error *ngIf="collaboratorForm.get('firstName')?.hasError('minlength')">
        Le prénom doit contenir au moins 2 caractères.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" />
      <mat-error *ngIf="collaboratorForm.get('email')?.hasError('required')">
        L'email est obligatoire.
      </mat-error>
      <mat-error *ngIf="collaboratorForm.get('email')?.hasError('email')">
        L'email n'est pas valide.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Téléphone</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Poste</mat-label>
      <input matInput formControlName="job" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Adresse</mat-label>
      <input matInput formControlName="postalAddress" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Genre</mat-label>
      <mat-select formControlName="gender">
        <mat-option value="male">Masculin</mat-option>
        <mat-option value="female">Féminin</mat-option>
        <mat-option value="other">Autre</mat-option>
      </mat-select>
    </mat-form-field>
  </form>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-button (click)="onSave()" [disabled]="!collaboratorForm.valid">Enregistrer</button>
</div>
