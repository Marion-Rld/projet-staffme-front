<div class="container">
  <div class="table-responsive">
  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container *ngFor="let column of displayedColumns">
      <ng-container *ngIf="column !== 'actions'" [matColumnDef]="column">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          {{ getColumnLabel(column) }}
        </th>
        <td mat-cell *matCellDef="let element" (click)="onRowClick(element)">
          <ng-container *ngIf="isDateColumn(column); else nonDateCell">
            {{ element[column] | date: 'dd/MM/yyyy' }}
          </ng-container>
          <ng-template #nonDateCell>
            <ng-container *ngIf="column !== 'teams'; else teamCell">
              {{ element[column] }}
            </ng-container>
            <ng-template #teamCell>
              {{ getTeamNames(element.teams) }}
            </ng-template>
          </ng-template>
        </td>
      </ng-container>
    </ng-container>

    <ng-container matColumnDef="actions" *ngIf="displayedColumns.includes('actions')">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button (click)="handleEdit(element)">
          <mat-icon class="material-icons color_yellow">edit</mat-icon>
        </button>
        <button (click)="handleDelete(element)">
          <mat-icon class="material-icons color_red">delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  </div>

  <mat-paginator [pageSizeOptions]="[3, 5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
