<div class="container">
  <div class="utilities-bar">
    <app-search-input
      (searchTermChange)="applyFilter($event)"
    ></app-search-input>
    <app-add-button
      [buttonText]="'AJOUTER UN UTILISATEUR'"
      (buttonClick)="openCreateUserDialog()"
    ></app-add-button>
  </div>
  <app-paginated-sortable-table
    [displayedColumns]="displayedColumns"
    [dataSource]="dataSource"
    [columnLabels]="translatedColumns"
    (rowAction)="handleRowAction($event)"
    [itemType]="'profile'"
  ></app-paginated-sortable-table>
</div>
