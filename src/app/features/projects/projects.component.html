<div class="container">
  <div class="utilities-bar">
    <app-search-input
      (searchTermChange)="applyFilter($event)"
    ></app-search-input>
    <app-add-button
      [buttonText]="'AJOUTER UN PROJET'"
      (buttonClick)="openCreateProjectDialog()"
    ></app-add-button>
  </div>
  <app-paginated-sortable-table
    [displayedColumns]="displayedColumns"
    [dataSource]="dataSource"
    [columnLabels]="translatedColumns"
    [itemType]="'project'"
    [pageSize]="20"
  />
</div>
