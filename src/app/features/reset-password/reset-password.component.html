<div class="reset-password-page">
  <div class="reset-password-branding">
    <img
      src="assets/images/logos/staffme-logo.png"
      alt="Staffme Logo"
      class="logo"
      loading="lazy"
    />
  </div>
  <div class="reset-password-container">
    <h1>Réinitialiser votre mot de passe</h1>
    <form
      class="reset-password-form"
      [formGroup]="resetForm"
      (ngSubmit)="onSubmit()"
    >
      <mat-form-field appearance="fill">
        <mat-label>Nouveau mot de passe</mat-label>
        <input
          matInput
          type="password"
          placeholder="Entrez votre nouveau mot de passe"
          formControlName="password"
          required
        />
        <mat-error *ngIf="resetForm.get('password')?.hasError('required')">
          Le mot de passe est requis
        </mat-error>
        <mat-error *ngIf="resetForm.get('password')?.hasError('minlength')">
          Le mot de passe doit contenir au moins 6 caractères
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Confirmer le mot de passe</mat-label>
        <input
          matInput
          type="password"
          placeholder="Confirmez votre nouveau mot de passe"
          formControlName="confirmPassword"
          required
        />
        <mat-error *ngIf="resetForm.hasError('notSame')">
          Les mots de passe ne correspondent pas
        </mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="accent"
        class="reset-password-button"
        type="submit"
        [disabled]="!resetForm.valid"
      >
        VALIDER
      </button>
    </form>
    <p class="go-back-text">
      Retourner à la <a href="/login" class="go-back-link">page de connexion</a>
    </p>
  </div>
</div>
