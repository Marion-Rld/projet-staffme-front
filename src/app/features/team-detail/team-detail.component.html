<div class="container">
  <app-back-button></app-back-button>
  <app-detail-card
    [name]="team.name"
    [collaboratorsCount]="getCollaboratorsText()"
    [data]="team"
    [editComponent]="teamDialogComponent"
    (entityUpdated)="refreshTeam()"
  ></app-detail-card>
  <div class="card-wrapper">
    <div *ngFor="let user of teamUsers">
      <app-collaborator-card [user]="user"></app-collaborator-card>
    </div>
  </div>
</div>
