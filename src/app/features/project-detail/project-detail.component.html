<div class="container">
  <app-back-button />
  <app-detail-card
    [name]="project.name"
    [startDate]="project.startDate"
    [endDate]="project.endDate"
    [description]="project.description"
    [collaboratorsCount]="getCollaboratorsText()"
    [editComponent]="projectDialogComponent"
    [data]="project"
  ></app-detail-card>
  <div class="card-wrapper">
    <div *ngFor="let user of teamUsers">
      <app-collaborator-card [user]="user"></app-collaborator-card>
    </div>
  </div>
</div>
